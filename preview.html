<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview an explanation</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --tint: #f1f5f9;
      --paper: #ffffff;
      --canvas: #f8fafc;
      --accent: #1d4ed8;
      --accent-soft: #e6eefd;
      --accent-ink: #ffffff;
      --problem: #b91c1c;
      --sans: system-ui, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, Consolas, monospace;
      --control: 32px;
      --drawer: 380px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      font: 14px/1.5 var(--sans);
      color: var(--ink);
      background: var(--canvas);
    }
    [hidden] { display: none !important; }
    button, select {
      height: var(--control);
      font: inherit;
      color: inherit;
      border-radius: 6px;
      cursor: pointer;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      white-space: nowrap;
    }
    button:hover { background: var(--tint); }
    button.primary { background: var(--accent); color: var(--accent-ink); }
    button.icon { width: var(--control); padding: 0; justify-content: center; color: var(--muted); }
    button.icon:hover { color: var(--ink); }
    select { width: 0; min-width: 0; flex: 1; padding: 0 6px; border: 1px solid var(--line); background: var(--paper); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* The rail is the only part that stays when the editor is closed: one button that opens it. */
    #rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 4px;
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    #toggle[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }

    #drawer {
      position: relative;
      display: grid;
      /* minmax(0, 1fr) keeps the column at the drawer's width. Left to auto, it grows to the widest child, and the editor spills past its own edge. */
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      flex: none;
      width: var(--drawer);
      background: var(--paper);
      border-right: 1px solid var(--line);
    }
    #drawer header { display: flex; align-items: center; gap: 4px; padding: 12px 8px 8px; }
    textarea {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 8px 12px;
      border: 0;
      border-top: 1px solid var(--line);
      resize: none;
      font: 12px/1.5 var(--mono);
      color: var(--ink);
      background: var(--paper);
      white-space: pre;
    }
    textarea:focus-visible { outline-offset: -2px; }
    #status { margin: 0; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    #status.error { color: var(--problem); }
    #resize { position: absolute; top: 0; right: -4px; bottom: 0; width: 8px; cursor: col-resize; z-index: 1; }
    #resize:hover, body.resizing #resize { background: var(--accent-soft); }

    #stage { position: relative; flex: 1; min-width: 0; }
    /* When nothing can be shown, the reason sits where the explanation would be, so it cannot be missed. */
    #notice {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 8px;
      padding: 24px;
      max-width: 60ch;
      margin: auto;
      color: var(--ink);
    }
    #notice h2 { margin: 0; font-size: 18px; text-wrap: balance; }
    #notice-text { display: grid; gap: 8px; color: var(--muted); }
    #notice-text p { margin: 0; }
    #notice a { color: var(--accent); }
    #notice code { padding: 2px 6px; border-radius: 4px; background: var(--tint); font: 13px var(--mono); white-space: nowrap; }
    #notice pre { margin: 0; padding: 8px 12px; border-radius: 6px; background: var(--tint); color: var(--ink); font: 13px var(--mono); overflow-x: auto; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--paper); }
    /* A drag or a resize over the frame would go to the frame's page, so the frame lets it through to this one. */
    body.dragging iframe, body.resizing iframe { pointer-events: none; }
    body.resizing { cursor: col-resize; user-select: none; }
    body.dragging::after {
      content: "Drop a content file to show it";
      position: fixed;
      inset: 8px;
      display: grid;
      place-items: center;
      border: 3px dashed var(--accent);
      border-radius: 12px;
      background: rgba(230, 238, 253, 0.85);
      color: var(--accent);
      font-size: 18px;
      font-weight: 600;
      pointer-events: none;
    }

    /* On a phone the editor covers the explanation instead of squeezing it. */
    @media (max-width: 720px) {
      #drawer { position: fixed; top: 0; bottom: 0; left: 41px; width: calc(100vw - 41px); z-index: 2; }
      #resize { display: none; }
    }
  </style>
</head>
<body>
  <nav id="rail">
    <button id="toggle" class="icon" type="button" aria-controls="drawer" aria-expanded="true" title="Close the editor">
      <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M10.5 2.5 13.5 5.5 5.5 13.5H2.5V10.5Z" /><path d="M9 4l3 3" /></svg>
    </button>
  </nav>
  <aside id="drawer" aria-label="Content file">
    <header>
      <select id="examples" aria-label="Examples">
        <option value="">Your file</option>
        <option value="examples/starter.js">Example: a starter</option>
        <option value="examples/pr-checks.packed.js">Example: a commit, with code</option>
      </select>
      <button id="open" type="button" title="Open a content file from your computer">
        <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M2.5 4.5v8h11v-6.5h-6l-1.5-1.5Z" /></svg>
        Open
      </button>
      <input id="file" type="file" accept=".js,text/javascript" hidden />
      <button id="preview" class="primary" type="button" title="Show this file (Ctrl+Enter)">Preview</button>
    </header>
    <textarea id="content" spellcheck="false" aria-label="Content file" placeholder="Paste a content file here, or drop one anywhere on the page."></textarea>
    <p id="status" role="status" aria-live="polite">Nothing leaves your browser.</p>
    <div id="resize" role="separator" aria-orientation="vertical" aria-label="Resize the editor" title="Drag to resize"></div>
  </aside>
  <main id="stage">
    <div id="notice" hidden>
      <h2 id="notice-title"></h2>
      <div id="notice-text"></div>
    </div>
    <!-- A content file is a script, so it runs in a sandbox: it can draw its page, but it cannot reach this site. -->
    <iframe id="frame" title="The explanation" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads" allow="clipboard-write"></iframe>
  </main>
  <script>
    // The page fills the skill's template in the browser, the same way the skill's sed command does, and shows it.
    // A packed content file carries its code files, so code notes work here too. Export HTML in the page's own menu saves it.
    const els = {
      content: document.getElementById("content"),
      examples: document.getElementById("examples"),
      file: document.getElementById("file"),
      status: document.getElementById("status"),
      drawer: document.getElementById("drawer"),
      toggle: document.getElementById("toggle"),
      frame: document.getElementById("frame"),
      notice: document.getElementById("notice"),
    };
    let template = null;
    let frameUrl = null;

    // Whether the editor is open, and its width, are kept for the next visit. Storage can be off, so each use is guarded.
    const saved = (() => {
      try {
        return JSON.parse(localStorage.getItem("preview-editor")) || {};
      } catch {
        return {};
      }
    })();
    function save() {
      try {
        localStorage.setItem("preview-editor", JSON.stringify({ closed: els.drawer.hidden, width: saved.width }));
      } catch {}
    }

    function setStatus(text, error) {
      els.status.textContent = text;
      els.status.classList.toggle("error", Boolean(error));
      if (error) setOpen(true);
    }

    // A problem that stops the preview replaces the explanation, with what to do about it.
    // `html` is only ever this page's own fixed text. Anything else goes in as plain text.
    function showNotice(title, text, html) {
      document.getElementById("notice-title").textContent = title;
      document.getElementById("notice-text")[html ? "innerHTML" : "textContent"] = text;
      els.notice.hidden = false;
      els.frame.hidden = true;
    }

    function setOpen(open) {
      els.drawer.hidden = !open;
      els.toggle.setAttribute("aria-expanded", String(open));
      els.toggle.title = open ? "Close the editor" : "Edit the content file";
      save();
    }

    async function readText(path) {
      const response = await fetch(path, { cache: "no-cache" });
      if (!response.ok) throw new Error(`Could not read ${path} (${response.status}).`);
      return response.text();
    }

    // The marker is alone on its line, as the sed command expects. A function as the replacement keeps $ in the content as written.
    // The content becomes the body of a script tag, so a closing script tag inside it is escaped the way Export does.
    function fill(content) {
      const marker = /^\/\* DIAGRAMS \*\/\r?$/m;
      if (!marker.test(template)) throw new Error("The template has no /* DIAGRAMS */ line.");
      return template.replace(marker, () => content.replace(/<\/script/gi, "<\\/script"));
    }

    function preview() {
      if (!template) return;
      const content = els.content.value;
      if (!content.trim()) {
        setStatus("Paste a content file first.", true);
        return;
      }
      // The page writes each move into the link's #, so Back undoes it. A srcdoc frame refuses that, and a blob URL allows it.
      // Each preview gets a new frame, so the browser's Back does not step into the previous one.
      const frame = els.frame.cloneNode(false);
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = URL.createObjectURL(new Blob([fill(content)], { type: "text/html" }));
      frame.src = frameUrl;
      frame.hidden = false;
      els.frame.replaceWith(frame);
      els.frame = frame;
      els.notice.hidden = true;
      setStatus("Shown. The ⚠ chip in the page lists mistakes, and its ⋯ menu exports HTML.");
    }

    function load(text) {
      els.content.value = text;
      preview();
    }

    async function openFile(file) {
      if (!file) return;
      els.examples.value = "";
      load(await file.text());
    }

    els.toggle.addEventListener("click", () => setOpen(els.drawer.hidden));
    document.getElementById("preview").addEventListener("click", preview);
    document.getElementById("open").addEventListener("click", () => els.file.click());
    els.file.addEventListener("change", () => {
      openFile(els.file.files[0]);
      els.file.value = "";
    });
    els.examples.addEventListener("change", async () => {
      if (!els.examples.value) return;
      try {
        load(await readText(els.examples.value));
      } catch (error) {
        setStatus(error.message, true);
      }
    });
    // Edited text is the reader's own file, no longer the example.
    els.content.addEventListener("input", () => {
      els.examples.value = "";
    });
    els.content.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        preview();
      }
    });

    // Dragging the editor's edge resizes it. The width is kept within reach of both sides.
    document.getElementById("resize").addEventListener("pointerdown", (event) => {
      event.preventDefault();
      document.body.classList.add("resizing");
      const left = els.drawer.getBoundingClientRect().left;
      const move = (moveEvent) => {
        saved.width = Math.round(Math.min(Math.max(moveEvent.clientX - left, 240), window.innerWidth * 0.7));
        document.documentElement.style.setProperty("--drawer", `${saved.width}px`);
      };
      const stop = () => {
        document.body.classList.remove("resizing");
        removeEventListener("pointermove", move);
        removeEventListener("pointerup", stop);
        save();
      };
      addEventListener("pointermove", move);
      addEventListener("pointerup", stop);
    });

    // A drop anywhere on the page opens the file. dragover must be cancelled, or the browser opens the file itself.
    let depth = 0;
    document.addEventListener("dragenter", (event) => {
      event.preventDefault();
      depth++;
      document.body.classList.add("dragging");
    });
    document.addEventListener("dragleave", () => {
      if (--depth === 0) document.body.classList.remove("dragging");
    });
    document.addEventListener("dragover", (event) => event.preventDefault());
    document.addEventListener("drop", (event) => {
      event.preventDefault();
      depth = 0;
      document.body.classList.remove("dragging");
      openFile(event.dataTransfer.files[0]);
    });

    if (saved.width) document.documentElement.style.setProperty("--drawer", `${saved.width}px`);
    // On a phone the open editor covers the explanation, so a first visit there starts with it closed.
    setOpen(saved.closed === undefined ? !matchMedia("(max-width: 720px)").matches : !saved.closed);

    // The page starts with the starter example, so it is never empty.
    (async () => {
      try {
        [template, els.content.value] = await Promise.all([readText("skill/assets/explainer.html"), readText("examples/starter.js")]);
        els.examples.value = "examples/starter.js";
        preview();
      } catch (error) {
        // Opened from disk, the browser refuses to read the template next to this page.
        if (error instanceof TypeError) {
          showNotice(
            "This page needs a server",
            '<p>A page opened from disk cannot read the files next to it. Use the <a href="https://overmesgit.github.io/mermaid-interactive/preview.html">preview on GitHub Pages</a>, or start a server in the repo folder:</p>' +
              "<pre>python3 -m http.server 8765</pre>" +
              "<p>Then open <code>http://127.0.0.1:8765/preview.html</code>.</p>",
            true,
          );
        } else showNotice("The preview could not start", error.message);
        setStatus("Nothing can be shown until the page loads.", true);
      }
    })();
  </script>
</body>
</html>
